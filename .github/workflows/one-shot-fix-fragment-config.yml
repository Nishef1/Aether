name: One-shot fragment config fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-fragment-config.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch legacy API-front fragment mode
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('aether/src/apifront.rs')
          s = p.read_text()
          old_import = 'use crate::fragment::{FragmentConfig, FragmentingStream};'
          new_import = 'use crate::fragment::{FragmentConfig, FragmentingStream, MaskMode};'
          if s.count(old_import) != 1:
              raise SystemExit('unexpected FragmentConfig import shape')
          s = s.replace(old_import, new_import)
          pattern = r'(Fingerprint::SplitLegacy\s*=>\s*FragmentConfig\s*\{\s*enabled:\s*true,\s*)(size_min:\s*24,)'
          s, count = re.subn(pattern, r'\1mode: MaskMode::LegacyTcpFragment,\n                \2', s, count=1)
          if count != 1:
              raise SystemExit('unexpected SplitLegacy FragmentConfig shape')
          p.write_text(s)
          PY
      - name: Check Core
        run: cargo check --manifest-path aether/Cargo.toml
      - name: Commit verified fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-fix-fragment-config.yml
          git add aether/src/apifront.rs
          git commit -m 'fix: preserve legacy mode in API-front fragmentation'
          git push origin HEAD:main
